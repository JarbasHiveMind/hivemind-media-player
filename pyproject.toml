[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-player-protocol"
description = "HiveMind media player agent protocol"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # ovos-audio 1.2.2a1 relaxed its ovos-bus-client cap to <3.0.0 (bus-client 2.x);
    # stable 1.2.0 still caps <2.0.0. Prerelease floor so pip resolves the 2.x line.
    "ovos-audio>=1.2.2a1",
    # OCP: only the 1.3.3a1 alpha relaxed the ovos-bus-client cap to <3.0.0;
    # the prerelease floor lets pip resolve it (with the bus-client 2.x stack)
    # under a plain install, no --pre. Stable 1.3.1 still caps <2.0.0.
    "ovos-plugin-common-play>=1.3.3a1,<2.0.0",
    "ovos-tts-plugin-server",
    # 0.9.x is the bus-client 2.x line (ovos-bus-client 2.x); prerelease floor.
    "hivemind-bus-client>=0.9.2a1,<1.0.0",
    "hivemind-plugin-manager>=0.3.0,<1.0.0",
    # OCP pulls ovos-plugin-manager with a loose floor; stable 2.2.0 still caps
    # ovos-bus-client<2.0.0, so pip backtracks onto old capped versions. 2.6.1a1
    # relaxed it to <3.0.0 — pin the prerelease floor to guide resolution onto
    # the bus-client 2.x line (until OCP/opm cut stable 2.x releases).
    "ovos-plugin-manager>=2.6.1a1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-media-player"

[project.optional-dependencies]
test = [
    "pytest",
    # in-process HiveMind topology simulator; also supplies hivemind-core (the
    # AGPL host this plugin imports from), keeping it out of the runtime deps.
    "hivescope>=0.5.1a1",
    # The e2e suite needs hivemind-core's policy-admission chain (the ACL
    # `hive.policy.denied` notification, added in 4.6.x) AND the agent-bus
    # forward-injection fix that landed in 4.6.2a1 (4.6.1a1 never delivers the
    # OCP command to the plugin's PlaybackService bus). hivescope only requires
    # >=4.0, so pin the floor here, otherwise pip backtracks onto a broken core.
    "hivemind-core>=4.6.2a1",
]

[project.entry-points."hivemind.agent.protocol"]
"hivemind-player-agent-plugin" = "hivemind_player_protocol:HiveMindPlayerProtocol"

[tool.setuptools]
packages = ["hivemind_player_protocol"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_player_protocol.version.__version__" }
