[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-player-protocol"
description = "HiveMind media player agent protocol"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # The whole stack rides the ovos-bus-client 2.x line (HiveMind core 4.6.x
    # requires >=2.0.0a3). The 2.x line is still prerelease, so the floor doubles
    # as the prerelease opt-in: a plain `pip install` resolves it with no --pre.
    "ovos-bus-client>=2.0.0a3,<3.0.0",
    # ovos-audio 1.2.2a1 relaxed its ovos-bus-client cap to <3.0.0 (bus-client 2.x);
    # stable 1.2.0 still caps <2.0.0. Prerelease floor so pip resolves the 2.x line.
    "ovos-audio>=1.2.2a1",
    # OCP: only the 1.3.3a1 alpha relaxed the ovos-bus-client cap to <3.0.0;
    # the prerelease floor lets pip resolve it (with the bus-client 2.x stack)
    # under a plain install, no --pre. Stable 1.3.1 still caps <2.0.0.
    "ovos-plugin-common-play>=1.3.3a1,<2.0.0",
    "ovos-tts-plugin-server",
    # 1.0.x is the proven-working line against current hivemind-core (4.13.18a1
    # needs bus-client 1.0.x); the stale <1.0.0 cap blocked that resolution.
    "hivemind-bus-client>=1.0.16a1",
    # hivemind-core's current line requires hivemind-plugin-manager>=0.9.0a7;
    # the runtime needs the same plugin host, so pin its prerelease floor too
    # — otherwise pip can only see stale, capped versions.
    "hivemind-plugin-manager>=0.9.0a7",
    # OCP pulls ovos-plugin-manager with a loose floor; stable 2.2.0 still caps
    # ovos-bus-client<2.0.0, so pip backtracks onto old capped versions. 2.6.1a1
    # relaxed it to <3.0.0 — pin the prerelease floor to guide resolution onto
    # the bus-client 2.x line (until OCP/opm cut stable 2.x releases).
    "ovos-plugin-manager>=2.11.6a1,<3.0.0",
    # ovos-workshop's bus-client-2.x compat is in the 8.x prerelease line (stable
    # 2.4–3.1 cap ovos-bus-client<2.0.0); pulled transitively by OCP with a loose
    # floor, so pin it onto the 2.x line.
    "ovos-workshop>=8.2.1a1,<9.0.0",
    # hivemind-plugin-manager requires a prerelease json-database; without this
    # explicit floor pip can only see a stale, capped stable release. The
    # floor is the prerelease opt-in; no --pre needed.
    "json-database>=1.0.4a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-media-player"

[project.optional-dependencies]
# Optional runtime backends for a fully-featured media-player device: a local
# audio output plugin (VLC), OCP stream extractors (youtube/etc.), and the
# PHAL hardware-abstraction layer for volume/system control.
extras = [
    "ovos-plugin-common-play[extractors]>=1.3.3a1,<2.0.0",
    "ovos-plugin-vlc",
    "ovos-phal",
]
# The end-to-end suite spins up a real hivemind-core master in-process and
# drives the real player plugin over a real HiveMessageBusClient (see
# tests/e2e/). Those heavyweight hosts live here, isolated from the basic test
# runner, and are wired in CI via the shared build-tests `[e2e]` install.
e2e = [
    # in-process HiveMind topology simulator; also supplies hivemind-core (the
    # AGPL host this plugin imports from), keeping it out of the runtime deps.
    "hivescope>=0.7.2a1",
    # The e2e suite needs hivemind-core's policy-admission chain (the ACL
    # `hive.policy.denied` notification) AND the agent-bus forward-injection
    # fix, both present in the proven-working 4.13.18a1 line. hivescope only
    # requires >=4.0, so pin the floor here, otherwise pip backtracks onto a
    # broken core.
    "hivemind-core>=4.13.18a1",
    # hivemind-core's current line pulls its client store + db/agent backend
    # plugins from prerelease lines; floor each so the resolver opts into the
    # prereleases (no --pre). Without these floors pip backtracks off a usable
    # hivemind-core.
    "hivemind-sqlite-database>=0.4.3a5",
    "hivemind-json-db-plugin>=0.0.3a2",
    "hivemind-ovos-agent-plugin>=0.3.10a1",
]
test = [
    "pytest",
    "pytest-cov",
    # the test suite is end-to-end only, so pull the e2e hosts in here too.
    "hivemind-player-protocol[e2e]",
]

[project.entry-points."hivemind.agent.protocol"]
"hivemind-player-agent-plugin" = "hivemind_player_protocol:HiveMindPlayerProtocol"

[tool.setuptools]
packages = ["hivemind_player_protocol"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_player_protocol.version.__version__" }
