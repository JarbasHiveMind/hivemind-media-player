[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-player-protocol"
description = "HiveMind media player agent protocol"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-media-player"

[project.optional-dependencies]
test = [
    "pytest",
    # in-process HiveMind topology simulator; also supplies hivemind-core (the
    # AGPL host this plugin imports from), keeping it out of the runtime deps.
    "hivescope>=0.5.0a2",
    # the ACL-denial e2e asserts the satellite receives `hive.policy.denied`,
    # which is emitted by the policy-admission chain added in hivemind-core
    # 4.6.x. hivescope only requires >=4.0, so pin the floor here — otherwise
    # pip resolves 4.0.0 (silently drops denied msgs) and the test fails.
    "hivemind-core>=4.6.0a1",
]

[project.entry-points."hivemind.agent.protocol"]
"hivemind-player-agent-plugin" = "hivemind_player_protocol:HiveMindPlayerProtocol"

[tool.setuptools]
packages = ["hivemind_player_protocol"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_player_protocol.version.__version__" }
dependencies = { file = ["requirements.txt"] }
