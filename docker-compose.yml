---
x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m
    max-size: "200m"
    max-file: "1"

x-common-variables: &common-vars
  UMASK: 002
  TZ: ${TIMEZONE}
  XDG_RUNTIME_DIR: $XDG_RUNTIME_DIR
  PULSE_SERVER: unix:${XDG_RUNTIME_DIR}/pulse/native
  PULSE_COOKIE: /home/ovos/.config/pulse/cookie
  DBUS_SESSION_BUS_ADDRESS: unix:path=${XDG_RUNTIME_DIR}/bus

x-hm-volumes: &hm-volumes
  - ${OVOS_CONFIG_FOLDER}:/home/ovos/.config/mycroft
  - ${OVOS_STATE_FOLDER}:/home/ovos/.local/state/mycroft
  - ${OVOS_SHARE_FOLDER}:/home/ovos/.local/share/mycroft
  - ${OVOS_CACHE_FOLDER}:/home/ovos/.cache/mycroft
  - ${OVOS_TMP_FOLDER}:/tmp/mycroft
  - ${HIVEMIND_CONFIG_FOLDER}:/home/hivemind/.config/hivemind:z
  - ${HIVEMIND_SHARE_FOLDER}:/home/hivemind/.local/share/hivemind:z
  # uncomment if you don't want to use the default server.json bundled with the container
  #- ${HIVEMIND_SERVER_CONFIG_FOLDER}:/home/hivemind/.config/hivemind-core:z

services:

  hivemind_media_player:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hivemind_media_player
    hostname: hivemind_media_player
    restart: always
    image: ovos/hivemind_media_player
    logging: *default-logging
    #pull_policy: always
    tty: true
    environment: *common-vars
    network_mode: host
    volumes: *hm-volumes
    depends_on:
      hivemind_redis:
        condition: service_started

  hivemind_redis:
    restart: always
    container_name: hivemind_redis
    image: redis
    ports:
      - ${HIVEMIND_REDIS_PORT}:6379
    volumes:
      - ${HIVEMIND_SERVER_CONFIG_FOLDER}/redis.conf:/usr/local/etc/redis/redis.conf
      - ${DATA_BASE_DIR}/hivemind/redis:/data
