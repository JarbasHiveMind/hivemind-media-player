name: Build Tests
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      install_extras: 'test'
      test_path: 'tests/'
      # Pre-install the prerelease deps the main (non --pre) `pip install wheel[test]`
      # can't resolve: hivescope (alpha-only) which pulls a compatible hivemind-core,
      # and ovos-plugin-common-play's 1.3.3a1 alpha — only the alpha relaxed the
      # ovos-bus-client cap to <3.0.0 (the latest stable, 1.3.1, still caps <2.0.0
      # and conflicts with hivemind-core's bus-client 2.x; see ovos-ocp-audio-plugin#194).
      pre_install_pip: '--pre hivescope ovos-plugin-common-play'
