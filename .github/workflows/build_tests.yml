name: Build Tests
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      # The e2e suite boots a real hivemind-core 4.6.x hub (bus-client 2.x), so it
      # needs the whole prerelease stack — including ovos-plugin-common-play's
      # 1.3.3a1 alpha, which is the only OCP that relaxed the ovos-bus-client cap
      # to <3.0.0 (the latest stable, 1.3.1, still caps <2.0.0 and conflicts with
      # hivemind-core). gh-automations build-tests installs the main wheel WITHOUT
      # --pre, so it can't resolve these; install with --prerelease=allow here.
      - name: Install (prerelease stack)
        run: |
          uv venv
          uv pip install --prerelease=allow -e ".[test]"
      - name: Run tests
        run: |
          uv run --no-sync python -m pytest tests/ -v --tb=short
