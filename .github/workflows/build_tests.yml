name: Build Tests
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      install_extras: 'test'
      test_path: 'tests/'
      # hivescope is prerelease-only on PyPI and the main `pip install wheel[test]`
      # runs without --pre, so pre-install it here; it pulls a compatible
      # prerelease hivemind-core (pinning hivemind-core explicitly backtracks onto
      # a newer alpha with conflicting deps).
      pre_install_pip: '--pre hivescope'
